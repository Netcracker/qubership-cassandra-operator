{{- if eq (include "cassandra.dbaas.declarativeRegistration" .) "true" }}
apiVersion: dbaas.netcracker.com/v1
kind: PhysicalDatabase
metadata:
  name: {{ .Release.Name }}-cassandra-physical-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cassandra.defaultLabels" . | nindent 4 }}
spec:
  operatorNamespace: {{ required "dbaas.declarativeRegistration.operatorNamespace is required when the PhysicalDatabase CRD is available" .Values.dbaas.declarativeRegistration.operatorNamespace | quote }}
  adapterAddress: {{ include "cassandra.dbaas.adapterAddress" . | quote }}
  credentialsSecretRef:
    name: {{ .Values.dbaas.adapter.secretName | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dbaas-operator-credentials-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.dbaas.adapter.secretName | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbaas-operator-credentials-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dbaas-operator-credentials-reader
subjects:
  - kind: ServiceAccount
    name: dbaas-operator
    namespace: {{ required "dbaas.declarativeRegistration.operatorNamespace is required when the PhysicalDatabase CRD is available" .Values.dbaas.declarativeRegistration.operatorNamespace | quote }}
{{- end }}
