{{- if and (.Values.cassandra.install) (.Values.cassandra.pdb) }}
{{- $nameAndSelector := "cassandra-cluster" }}
{{- $totalReplicas := 0 }}
{{- range $dcKey, $dc := .Values.cassandra.deploymentSchema.dataCenters }}
  {{if or ($dc.deploy) (eq ($dc.deploy | toString) "<nil>") }}
  {{- $totalReplicas = add $totalReplicas $dc.replicas }}
  {{- end }}
{{- end }}
{{- $minAvailable := add1 (div $totalReplicas 2) }}
{{- /* Render only if at least one pod can be disrupted; otherwise the PDB would block every node drain. */ -}}
{{- if lt (int $minAvailable) (int $totalReplicas) }}
{{template "nosql.core.pdb" (dict "name" $nameAndSelector "labels" (dict "service" $nameAndSelector) "minAvailable" $minAvailable "values" $)}}
{{- end }}
---
{{- end }}
